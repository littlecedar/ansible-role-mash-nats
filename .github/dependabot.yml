---
# Workflows pin actions to their floating major tag, so this is what keeps them
# current: one grouped PR per week, gated by the same CI the code goes through.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"