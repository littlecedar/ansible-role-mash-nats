---
name: Publish

# The role release tag (`v<version>-0`) is created separately and MUST NOT trigger an
# image publish, so this workflow never runs on git tags.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read image version pins
        id: pin
        run: |
          set -eu

          version=$(sed -n 's/^ARG NATS_VERSION=\(.*\)$/\1/p' Dockerfile | head -n 1)
          if [ -z "$version" ]; then
            echo "Cannot read ARG NATS_VERSION from Dockerfile" >&2
            exit 1
          fi
          echo "nats_version=${version}" >>"$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute NATS image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.pin.outputs.nats_version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build NATS image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: ansible-role-mash-nats:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nats
          cache-to: type=gha,mode=max,scope=nats

      # Nothing is pushed before the smoke test and molecule pass.
      - name: Run NATS smoke test
        run: ./scripts/smoke-test-nats.sh ansible-role-mash-nats:ci

      - name: Install molecule and Docker driver
        run: pip install "molecule" "molecule-plugins[docker]"

      - name: Install Ansible role and collection dependencies
        run: |
          ansible-galaxy role install -r molecule/default/requirements.yml
          ansible-galaxy collection install community.docker ansible.posix

      - name: Run role smoke test
        run: molecule test
        env:
          # molecule-docker 2.1.0 still uses string conditionals,
          # ansible-core 2.21 rejects them by default.
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        env:
          NATS_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu

          push_tags() {
            source_image=$1
            tags=$2

            printf '%s\n' "$tags" | while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              docker tag "$source_image" "$tag"
              docker push "$tag"
            done
          }

          push_tags ansible-role-mash-nats:ci "$NATS_TAGS"
