---
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint

      - name: Install collections the role uses
        run: ansible-galaxy collection install community.docker ansible.posix

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint

  image:
    name: Image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build NATS image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: ansible-role-mash-nats:ci
          cache-from: type=gha,scope=nats

      - name: Run NATS smoke test
        run: ./scripts/smoke-test-nats.sh ansible-role-mash-nats:ci

  molecule:
    name: Role smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install molecule and Docker driver
        run: pip install "molecule" "molecule-plugins[docker]"

      - name: Install Ansible role and collection dependencies
        run: |
          ansible-galaxy role install -r molecule/default/requirements.yml
          ansible-galaxy collection install community.docker ansible.posix

      - name: Run role smoke test
        run: molecule test
        env:
          # molecule-docker 2.1.0 still uses string conditionals,
          # ansible-core 2.21 rejects them by default.
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
