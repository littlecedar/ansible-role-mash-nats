---
# Shared verification tasks for the NATS role. They run inside the molecule instance,
# where the systemd unit, container and network all live.
- name: Verify the NATS unit becomes active
  ansible.builtin.command:
    cmd: systemctl is-active {{ nats_identifier }}.service
  register: nats_verify_unit_state
  changed_when: false
  retries: 60
  delay: 2
  until: nats_verify_unit_state.stdout | trim == 'active'
  failed_when: nats_verify_unit_state.stdout | trim != 'active'

# --- 1. Server startup ------------------------------------------------------
- name: Read the NATS unit journal
  ansible.builtin.command:
    cmd: journalctl -u {{ nats_identifier }}.service --no-pager --lines 2000
  register: nats_verify_journal
  changed_when: false

- name: Verify the server reached the ready state
  ansible.builtin.assert:
    that:
      - "'Server is ready' in nats_verify_journal.stdout"

# --- 2. Rendered configuration ---------------------------------------------
- name: Verify the support file mode
  ansible.builtin.stat:
    path: "{{ nats_base_path }}/nats.conf"
  register: nats_verify_support_file

- name: Verify the support file is not group or world writable
  ansible.builtin.assert:
    that:
      - nats_verify_support_file.stat.mode == '0640'
    fail_msg: "{{ nats_base_path }}/nats.conf has mode {{ nats_verify_support_file.stat.mode }}, expected 0640"

- name: Read the rendered configuration
  ansible.builtin.slurp:
    src: "{{ nats_base_path }}/nats.conf"
  register: nats_verify_support_file_content
  no_log: true

- name: Verify the rendered configuration listens and authorizes
  vars:
    nats_conf: "{{ nats_verify_support_file_content.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - 'nats_conf is search(''(?m)^\s*listen: 0\.0\.0\.0:4222\s*$'')'
      - 'nats_conf is search(''(?m)^authorization \{ token: "smoke-nats-token" \}\s*$'')'

# --- 3. Network and container hardening ------------------------------------
- name: Inspect the NATS container network
  community.docker.docker_network_info:
    name: "{{ nats_container_network }}"
  register: nats_verify_network_info

- name: Verify the container network is internal
  ansible.builtin.assert:
    that:
      - nats_verify_network_info.network.Internal | bool

- name: Inspect the NATS container
  ansible.builtin.command:
    cmd: docker inspect {{ nats_identifier }}
  register: nats_verify_inspect
  changed_when: false

- name: Verify container isolation
  vars:
    nats_container: "{{ nats_verify_inspect.stdout | from_json | first }}"
  ansible.builtin.assert:
    that:
      - nats_container['Config']['User'] == '1000:1000'
      - nats_container['HostConfig']['ReadonlyRootfs'] | bool
      - "'ALL' in nats_container['HostConfig']['CapDrop']"
      - nats_container['HostConfig']['PortBindings'] | default({}) | length == 0
      - nats_container['HostConfig']['NetworkMode'] == nats_container_network

# The image is scratch-based (no `id`, no shell), so the effective user is read from the
# host's view of the container process.
- name: Verify the effective user of the container process
  ansible.builtin.shell:
    cmd: |
      set -eu
      pid=$(docker inspect --format '{{ "{{" }} .State.Pid {{ "}}" }}' {{ nats_identifier }})
      grep -E '^Uid:' "/proc/${pid}/status" | cut -f2
  register: nats_verify_uid
  changed_when: false
  failed_when: nats_verify_uid.stdout | trim != '1000'

# --- 4. No host exposure ----------------------------------------------------
- name: Read TCP listeners
  ansible.builtin.command:
    cmd: ss -Hlntp
  register: nats_verify_tcp_listeners
  changed_when: false

- name: Verify the client port is not published on the host
  vars:
    tcp: "{{ nats_verify_tcp_listeners.stdout }}"
  ansible.builtin.assert:
    that:
      - tcp is not search(':4222\s')

# --- 5. Connectivity from the network --------------------------------------
- name: Verify a client on the network resolves the container name and connects
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ nats_container_network }} busybox:1.36
      sh -c 'nc -w 5 {{ nats_identifier }} 4222'
  changed_when: false

# nc only proves the port accepts TCP; nats-server greets before authenticating,
# so the token contract needs real CONNECT frames.
- name: Verify an authenticated client completes the NATS handshake
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ nats_container_network }} busybox:1.36
      sh -c '( printf "CONNECT {\"verbose\":true,\"auth_token\":\"{{ nats_molecule_token }}\"}\r\nPING\r\n"; sleep 1 ) | nc -w 3 {{ nats_identifier }} 4222'
  register: nats_verify_handshake_allowed
  changed_when: false

- name: Assert the authenticated client is accepted
  ansible.builtin.assert:
    that:
      - "nats_verify_handshake_allowed.stdout is search('(?m)^\\+OK\\r?$')"
      - "nats_verify_handshake_allowed.stdout is search('(?m)^PONG\\r?$')"
    fail_msg: "Authenticated client got no +OK/PONG: {{ nats_verify_handshake_allowed.stdout }}"

- name: Verify an unauthenticated client is rejected
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ nats_container_network }} busybox:1.36
      sh -c '( printf "CONNECT {\"verbose\":true}\r\nPING\r\n"; sleep 1 ) | nc -w 3 {{ nats_identifier }} 4222'
  register: nats_verify_handshake_denied
  changed_when: false

- name: Assert the unauthenticated client is refused
  ansible.builtin.assert:
    that:
      - "nats_verify_handshake_denied.stdout is search('Authorization Violation')"
      - "nats_verify_handshake_denied.stdout is not search('(?m)^PONG\\r?$')"
    fail_msg: "A client without the token got further than Authorization Violation: {{ nats_verify_handshake_denied.stdout }}"

- name: Verify token-authenticated publish reaches a subscriber
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ nats_container_network }} busybox:1.36 sh -c '
      C="CONNECT {\"verbose\":true,\"auth_token\":\"{{ nats_molecule_token }}\"}\r\n";
      ( printf "$C"; printf "SUB probe 1\r\nPING\r\n"; sleep 4 ) | nc -w 5 {{ nats_identifier }} 4222 > /tmp/sub.out &
      sleep 2;
      ( printf "$C"; printf "PUB probe 5\r\nhello\r\nPING\r\n"; sleep 1 ) | nc -w 3 {{ nats_identifier }} 4222 > /dev/null;
      wait; grep -q hello /tmp/sub.out'
  register: nats_verify_round_trip
  changed_when: false

- name: Assert the published message reached the subscriber
  ansible.builtin.assert:
    that:
      - nats_verify_round_trip.rc == 0
    fail_msg: "Publish did not reach the subscriber: {{ nats_verify_round_trip.stderr }}"

# --- 6. No secret leaks -----------------------------------------------------
- name: Verify no secret appears in the unit journal
  vars:
    leaked: "{{ nats_molecule_secrets | select('in', nats_verify_journal.stdout) | list }}"
  ansible.builtin.assert:
    that:
      - leaked | length == 0
    fail_msg: "The unit journal contains secret values."

- name: Read the container command line and mounts
  ansible.builtin.command:
    cmd: >-
      docker inspect --format
      '{{ "{{" }} json .Config.Entrypoint {{ "}}" }}{{ "{{" }} json .Config.Cmd {{ "}}" }}{{ "{{" }} json .Args {{ "}}" }}{{ "{{" }} json .Mounts {{ "}}" }}{{ "{{" }} json .HostConfig.Binds {{ "}}" }}'
      {{ nats_identifier }}
  register: nats_verify_visible_config
  changed_when: false
  no_log: true

- name: Verify no secret appears in any inspectable container field
  vars:
    leaked: "{{ nats_molecule_secrets | select('in', nats_verify_visible_config.stdout) | list }}"
  ansible.builtin.assert:
    that:
      - leaked | length == 0
    fail_msg: "A secret is visible in the container's command line, mounts or arguments."
